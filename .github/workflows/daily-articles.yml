name: Daily article publication

on:
  schedule:
    - cron: '0 11 * * *'
    - cron: '5,20,35,50 * * * *'
  workflow_dispatch:
    inputs:
      preview:
        description: 'Check reviewed editions without publishing'
        type: boolean
        default: true
      retry_only:
        description: 'Retry pending language editions only'
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: daily-article-publication
  cancel-in-progress: false

jobs:
  review-and-publish:
    if: github.ref == 'refs/heads/main' && (vars.FREE_ARTICLE_PUBLISH_ENABLED == 'true' || (github.event_name == 'workflow_dispatch' && inputs.preview))
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      PREVIEW: ${{ inputs.preview }}
      RETRY_ONLY: ${{ inputs.retry_only || github.event.schedule == '5,20,35,50 * * * *' }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install -r requirements.txt
      - name: Select reviewed language editions
        run: |
          options=()
          if [ "$PREVIEW" = true ]; then
            options+=(--preview)
          fi
          if [ "$RETRY_ONLY" = true ]; then
            options+=(--retry-only)
          fi
          python scripts/publish_reviewed_articles.py "${options[@]}"
      - name: Verify site build and publish
        if: env.PREVIEW != 'true'
        run: |
          git add -- content/articles
          if git diff --cached --quiet; then
            exit 0
          fi
          python scripts/build_articles.py
          git diff --cached --name-only -z -- content/articles | while IFS= read -r -d '' file; do
            relative="${file#content/articles/}"
            if [[ "$relative" == */* ]]; then
              html="${relative%%/*}/articles/${relative##*/}"
            else
              html="articles/$relative"
            fi
            test -f "${html%.md}.html"
          done
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Publish reviewed UK VISA FOLIO topic'
          git push origin HEAD:main
