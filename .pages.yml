
content:
  - name: articles
    label: 英国ビザ記事
    type: collection
    path: content/articles
    format: yaml-frontmatter
    view:
      fields: [title, date, status, category]
      primary: title
      sort: [date]
    fields:
      - name: title
        label: 記事タイトル
        type: string
        required: true
      - name: date
        label: 公開日
        type: date
        required: true
      - name: status
        label: 公開状態
        type: select
        options:
          values:
            - name: draft
              label: 下書き
            - name: published
              label: 公開
        default: draft
      - name: category
        label: 記事の分類
        type: select
        options:
          values:
            - name: guide
              label: 解説記事
            - name: news
              label: NEWS
        default: guide
      - name: significant_update_at
        label: 重要更新日（通常の修正では空欄）
        type: date
        required: false
      - name: description
        label: 記事の説明
        type: text
      - name: source_url
        label: 英国政府公式URL
        type: string
      - name: body
        label: 記事本文
        type: rich-text
